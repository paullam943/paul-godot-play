<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>使徒保羅</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: #242424;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000">
<style>
html, body { width: 100%; height: 100%; position: fixed; inset: 0; overflow: hidden; overscroll-behavior: none;
  touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
#canvas { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
#paul-fs { position: fixed; top: 6px; left: 50%; transform: translateX(-50%); z-index: 10; padding: 5px 10px;
  font: 13px/1 sans-serif; color: #f3e3c0; background: rgba(0,0,0,.45); border: 1px solid rgba(243,227,192,.45);
  border-radius: 6px; opacity: .8; transition: opacity .6s; }
#paul-fs.dim { opacity: .3; }
/* 直向：目標行佔滿左上，全螢幕鈕移到右上「選單」下方，不相疊 */
@media (orientation: portrait) { #paul-fs { top: 74px; left: auto; right: 8px; transform: none; } }
#paul-nogl { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  padding: 2rem; background: #1a1612; color: #f3e3c0; font: 16px/1.6 sans-serif; text-align: center; }
</style>
<script>
(function () {
  // Godot 網頁範本在 canvas 的 webglcontextlost 上呼叫英文 alert（「WebGL context lost, please reload the page」）。
  // 手機把分頁丟到背景後常會發生。不彈視窗，直接重新載入。
  var addListener = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function (type, listener, options) {
    if (type === 'webglcontextlost' && typeof listener === 'function' && String(listener).indexOf('WebGL context lost') !== -1) {
      listener = function (ev) {
        ev.preventDefault();
        window.location.reload();
      };
    }
    return addListener.call(this, type, listener, options);
  };
  // 禁止頁面縮放、捲動、長按選取／選單（遊戲自己處理觸控）。
  var stop = function (e) { e.preventDefault(); };
  document.addEventListener('contextmenu', stop);
  document.addEventListener('gesturestart', stop);
  document.addEventListener('dblclick', stop);
  document.addEventListener('touchmove', stop, { passive: false });
  // 瀏覽器常禁止自動出聲。標題音樂在畫面準備好時就 play()；這裏盡早 resume。
  // 若被擋住：第一下 pointer／touch／key（含全螢幕鈕，不必選選單）先播一段無聲解鎖，再 resume。
  // 分頁回到前景或視窗聚焦時也 resume（已解鎖過才會成功）。音量仍由遊戲的匯流排設定決定。
  var AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    var ctxs = [];
    var silentDone = false;
    var Wrapped = function (a, b) {
      var c = new AC(a, b);
      ctxs.push(c);
      // 載入當下先試自動播放（桌面 Chrome 有時允許；手機多半拒絕，留待手勢）。
      var kick = function () {
        if (c.state === 'suspended') { c.resume().catch(function () {}); }
      };
      kick();
      setTimeout(kick, 0);
      return c;
    };
    Wrapped.prototype = AC.prototype;
    window.AudioContext = Wrapped;
    if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
    var silentUnlock = function (ctx) {
      try {
        var rate = ctx.sampleRate || 22050;
        var buf = ctx.createBuffer(1, 1, rate);
        var src = ctx.createBufferSource();
        src.buffer = buf;
        var gain = ctx.createGain();
        gain.gain.value = 0;
        src.connect(gain);
        gain.connect(ctx.destination);
        src.start(0);
      } catch (e) {}
    };
    var unlock = function (fromGesture) {
      var did = false;
      for (var i = 0; i < ctxs.length; i++) {
        var ctx = ctxs[i];
        if (!ctx || ctx.state === 'closed') { continue; }
        did = true;
        if (fromGesture && !silentDone) { silentUnlock(ctx); }
        if (ctx.state !== 'running') { ctx.resume().catch(function () {}); }
      }
      if (fromGesture && did) { silentDone = true; }
    };
    window.paulAudioState = function () {
      if (!ctxs.length) { return 'none'; }
      return ctxs[0].state || 'none';
    };
    window.paulTryAudio = function () { unlock(false); };
    window.paulUnlockAudio = function () { unlock(true); };
    ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown'].forEach(function (t) {
      window.addEventListener(t, function () { unlock(true); }, true);
    });
    window.addEventListener('focus', function () { unlock(false); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { unlock(false); } });
  }
  window.addEventListener('DOMContentLoaded', function () {
    var gl = null;
    try { gl = document.createElement('canvas').getContext('webgl2'); } catch (e) { gl = null; }
    if (!gl) {
      var n = document.createElement('div');
      n.id = 'paul-nogl';
      n.textContent = '這個瀏覽器不支援 WebGL 2，遊戲無法執行。請用最新版 Chrome、Edge、Firefox 或 Safari（iOS 15 以上）。';
      document.body.appendChild(n);
      return;
    }
    // 全螢幕按鈕（瀏覽器支援時才顯示；iPhone Safari 不支援，可用「加入主畫面」）。
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) { return; }
    var b = document.createElement('button');
    b.id = 'paul-fs';
    b.type = 'button';
    b.textContent = '⛶ 全螢幕';
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      // 全螢幕鈕在遊戲畫面外，Godot 收不到這一下。同一手勢裏解鎖音訊，不必先選選單。
      if (window.paulUnlockAudio) { window.paulUnlockAudio(); }
      // 不鎖定方向：直向、橫向都可以玩（遊戲按螢幕比例重排，見 TouchUI）。
      var p = req.call(el);
      if (p && p.then) { p.catch(function () {}); }
      var c = document.getElementById('canvas');
      if (c) { c.focus(); }
    });
    var sync = function () {
      b.style.display = (document.fullscreenElement || document.webkitFullscreenElement) ? 'none' : 'block';
    };
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
    document.body.appendChild(b);
    setTimeout(function () { b.classList.add('dim'); }, 5000);
  });
})();
</script>
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":80794176,"index.wasm":35740641},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
