html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}
body {
	color: #f3e3c0;
	background-color: #17140f;
	overflow: hidden;
	touch-action: none;
}
#canvas {
	display: block;
}
#canvas:focus {
	outline: none;
}
#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}
#status, #status-splash {
	top: 0;
	bottom: 0;
}
#status {
	background-color: #17140f;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
	z-index: 5;
}
/* Hide Godot splash image entirely — custom V1 boot UI only */
#status-splash {
	display: none !important;
}
#status-progress {
	/* Keep element for Engine progress hooks; visually replaced by #paul-load-* */
	position: absolute;
	width: 1px;
	height: 1px;
	opacity: 0;
	pointer-events: none;
	bottom: 0;
}
#status-notice {
	display: none;
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: "Noto Sans TC", "Noto Sans", "Droid Sans", Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;

<script>
(function () {
  // Godot 網頁範本在 canvas 的 webglcontextlost 上呼叫英文 alert（「WebGL context lost, please reload the page」）。
  // 手機把分頁丟到背景後常會發生。不彈視窗，直接重新載入。
  var addListener = EventTarget.prototype.addEventListener;
  EventTarget.prototype.addEventListener = function (type, listener, options) {
    if (type === 'webglcontextlost' && typeof listener === 'function' && String(listener).indexOf('WebGL context lost') !== -1) {
      listener = function (ev) {
        ev.preventDefault();
        window.location.reload();
      };
    }
    return addListener.call(this, type, listener, options);
  };
  // 禁止頁面縮放、捲動、長按選取／選單（遊戲自己處理觸控）。
  var stop = function (e) { e.preventDefault(); };
  document.addEventListener('contextmenu', stop);
  document.addEventListener('gesturestart', stop);
  document.addEventListener('dblclick', stop);
  document.addEventListener('touchmove', stop, { passive: false });
  // 瀏覽器常禁止自動出聲。標題音樂在畫面準備好時就 play()；這裏盡早 resume。
  // 若被擋住：第一下 pointer／touch／key（含全螢幕鈕，不必選選單）先播一段無聲解鎖，再 resume。
  // 分頁回到前景或視窗聚焦時也 resume（已解鎖過才會成功）。音量仍由遊戲的匯流排設定決定。
  var AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    var ctxs = [];
    var silentDone = false;
    var Wrapped = function (a, b) {
      var c = new AC(a, b);
      ctxs.push(c);
      // 載入當下先試自動播放（桌面 Chrome 有時允許；手機多半拒絕，留待手勢）。
      var kick = function () {
        if (c.state === 'suspended') { c.resume().catch(function () {}); }
      };
      kick();
      setTimeout(kick, 0);
      return c;
    };
    Wrapped.prototype = AC.prototype;
    window.AudioContext = Wrapped;
    if (window.webkitAudioContext) { window.webkitAudioContext = Wrapped; }
    var silentUnlock = function (ctx) {
      try {
        var rate = ctx.sampleRate || 22050;
        var buf = ctx.createBuffer(1, 1, rate);
        var src = ctx.createBufferSource();
        src.buffer = buf;
        var gain = ctx.createGain();
        gain.gain.value = 0;
        src.connect(gain);
        gain.connect(ctx.destination);
        src.start(0);
      } catch (e) {}
    };
    var unlock = function (fromGesture) {
      var did = false;
      for (var i = 0; i < ctxs.length; i++) {
        var ctx = ctxs[i];
        if (!ctx || ctx.state === 'closed') { continue; }
        did = true;
        if (fromGesture && !silentDone) { silentUnlock(ctx); }
        if (ctx.state !== 'running') { ctx.resume().catch(function () {}); }
      }
      if (fromGesture && did) { silentDone = true; }
    };
    window.paulAudioState = function () {
      if (!ctxs.length) { return 'none'; }
      return ctxs[0].state || 'none';
    };
    window.paulTryAudio = function () { unlock(false); };
    window.paulUnlockAudio = function () { unlock(true); };
    ['pointerdown', 'pointerup', 'touchstart', 'touchend', 'click', 'keydown'].forEach(function (t) {
      window.addEventListener(t, function () { unlock(true); }, true);
    });
    window.addEventListener('focus', function () { unlock(false); });
    document.addEventListener('visibilitychange', function () { if (!document.hidden) { unlock(false); } });
  }
  window.addEventListener('DOMContentLoaded', function () {
    var gl = null;
    try { gl = document.createElement('canvas').getContext('webgl2'); } catch (e) { gl = null; }
    if (!gl) {
      var n = document.createElement('div');
      n.id = 'paul-nogl';
      n.textContent = '這個瀏覽器不支援 WebGL 2，遊戲無法執行。請用最新版 Chrome、Edge、Firefox 或 Safari（iOS 15 以上）。';
      document.body.appendChild(n);
      return;
    }
    // 全螢幕按鈕（瀏覽器支援時才顯示；iPhone Safari 不支援，可用「加入主畫面」）。
    var el = document.documentElement;
    var req = el.requestFullscreen || el.webkitRequestFullscreen;
    if (!req || !(document.fullscreenEnabled || document.webkitFullscreenEnabled)) { return; }
    var b = document.createElement('button');
    b.id = 'paul-fs';
    b.type = 'button';
    b.textContent = '⛶ 全螢幕';
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      // 全螢幕鈕在遊戲畫面外，Godot 收不到這一下。同一手勢裏解鎖音訊，不必先選選單。
      if (window.paulUnlockAudio) { window.paulUnlockAudio(); }
      // 不鎖定方向：直向、橫向都可以玩（遊戲按螢幕比例重排，見 TouchUI）。
      var p = req.call(el);
      if (p && p.then) { p.catch(function () {}); }
      var c = document.getElementById('canvas');
      if (c) { c.focus(); }
    });
    var sync = function () {
      b.style.display = (document.fullscreenElement || document.webkitFullscreenElement) ? 'none' : 'block';
    };
    document.addEventListener('fullscreenchange', sync);
    document.addEventListener('webkitfullscreenchange', sync);
    document.body.appendChild(b);
    setTimeout(function () { b.classList.add('dim'); }, 5000);
  });
})();
</script>

		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":false,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":50421532,"index.wasm":35740641},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4,"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadFill = document.getElementById('paul-load-fill');
	const loadWalker = document.getElementById('paul-load-walker');
	const loadStage = document.getElementById('paul-load-stage');
	const loadRoot = document.getElementById('paul-load');

	let initializing = true;
	let statusMode = '';
	let walkFrame = 0;
	let walkTimer = 0;
	let lastPct = 0;

	function setWalkFrame(frame) {
		walkFrame = ((frame % 4) + 4) % 4;
		if (loadWalker) {
			loadWalker.style.backgroundPosition = (-walkFrame * 64) + 'px 0';
		}
	}

	function setProgressVisual(pct) {
		if (!loadFill || !loadWalker || !loadStage) {
			return;
		}
		const p = Math.max(0, Math.min(1, pct));
		lastPct = p;
		const barW = loadStage.clientWidth || 320;
		loadFill.style.width = (p * 100) + '%';
		// sprite x = bar_left + fill_w − half_display_width  (margin-left already −32 for 64px Paul)
		loadWalker.style.left = (p * barW) + 'px';
	}

	function ensureWalkLoop() {
		if (walkTimer) {
			return;
		}
		walkTimer = window.setInterval(function () {
			if (!initializing) {
				return;
			}
			setWalkFrame(walkFrame + 1);
		}, 100);
	}

	function stopWalkLoop() {
		if (walkTimer) {
			window.clearInterval(walkTimer);
			walkTimer = 0;
		}
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			stopWalkLoop();
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		if (loadRoot) {
			loadRoot.style.display = mode === 'progress' ? 'flex' : 'none';
		}
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		if (mode === 'progress') {
			ensureWalkLoop();
			setProgressVisual(lastPct > 0 ? lastPct : 0.02);
		}
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
		stopWalkLoop();
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					setProgressVisual(current / total);
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					// Indeterminate: keep a small lead so Paul is visible and walking
					if (lastPct < 0.08) {
						setProgressVisual(0.08);
					}
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
